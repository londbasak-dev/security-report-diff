[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-report-diff"
version = "0.1.0"
description = "Offline SARIF finding and severity comparison with minimal output"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
security-report-diff = "security_report_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
